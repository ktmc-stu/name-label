<!-- index.html -->
<!doctype html><html lang="zh-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KTMC Parent Label · 家長標籤及考勤系統</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lang.css">
<style>
:root{--nav:60px}
html{scroll-padding-top:calc(var(--nav) + 18px)}
.portal-nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:9500;display:flex;align-items:center;gap:16px;padding:0 clamp(16px,4vw,40px);background:rgba(255,255,255,.95);border-bottom:1px solid transparent;transition:.2s}
.portal-nav.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 20px rgba(15,42,70,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand .mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--accent)}
.brand .mark svg{width:15px;height:15px}
.brand small{display:block;font-size:10.5px;font-weight:400;color:var(--faint);letter-spacing:.04em}
.navlinks{display:flex;gap:2px;margin-left:auto}
.navlinks a{padding:8px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.navlinks a:hover{color:var(--text);text-decoration:none}
.navlinks a.active{color:var(--accent-deep);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.portal{max-width:1120px;margin:0 auto;padding:calc(var(--nav) + 42px) clamp(16px,4vw,40px) 64px}
.portal section{margin-bottom:72px}
.eyebrow{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.portal h1{font-size:clamp(34px,5vw,52px);line-height:1.1;letter-spacing:-.025em;margin:16px 0 14px;font-weight:600}
.portal h1 .accent{color:var(--accent)}
.portal h2{font-size:clamp(22px,2.6vw,28px);letter-spacing:-.015em;margin:6px 0;font-weight:600}
.t-zh{font-size:.6em;color:var(--muted);font-weight:400;margin-left:.55em}
.lede{color:var(--muted);font-size:15px;max-width:620px;margin:0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero{display:grid;grid-template-columns:1.2fr .9fr;gap:40px;align-items:center}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:34px;border-top:1px solid var(--line)}
.stat{padding:16px 18px 4px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat .n{font-size:26px;font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat.present .n{color:var(--ok)}
.stat .l{font-size:11px;color:var(--faint);font-weight:500;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:24px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tagline{font-size:11px;font-weight:600;letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.hero-day{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px}
.hero-preview{margin:20px auto 10px;box-shadow:0 4px 16px rgba(15,42,70,.08)}
.att-sample{display:flex;align-items:center;gap:8px;margin-top:14px;padding:9px 12px;background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:8px;font-size:12.5px;color:var(--ok)}
.att-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.att-sample .att-time{font-family:var(--mono)}
.att-sample .att-by{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:11px}
.hero-note{font-size:12.5px;color:var(--muted);margin-top:12px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.station{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;transition:.15s}
.station:hover{border-color:var(--accent-line);box-shadow:var(--shadow-sm)}
.st-top{display:flex;align-items:center;gap:9px}
.st-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.station.on .st-dot{background:var(--ok)}
.st-name{font-weight:600;font-size:15px}
.st-token{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent-line);padding:2px 8px;border-radius:5px}
.st-meta{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}
.meta{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:5px}
.st-foot{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:11px}
.st-foot .on{color:var(--ok)}.st-foot .off{color:var(--faint)}
.qbadge{font-family:var(--mono);color:var(--ink-2)}.qbadge.hot{color:var(--bad)}
.empty{grid-column:1/-1;text-align:center;padding:44px 20px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted)}
.launch{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.launch-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;transition:.15s}
.launch-card:hover{border-color:var(--accent-line);box-shadow:var(--shadow-sm)}
.lc-top{display:flex;align-items:center}
.launch-card .ic{width:38px;height:38px;border:1px solid var(--accent-line);border-radius:9px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.launch-card .ic svg{width:18px;height:18px}
.launch-card .idx{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.launch-card h3{margin:2px 0 0;font-size:20px;font-weight:600;border:0;padding:0}
.launch-card p{margin:0;font-size:13.5px;color:var(--muted)}
.launch-card .feat{display:flex;gap:6px;flex-wrap:wrap}
.launch-card .feat span{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:5px}
.launch-card .btn{align-self:flex-start;margin-top:auto}
.setup-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 24px}
.step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .num{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:14px;color:var(--accent-deep);border:1px solid var(--accent-line);background:var(--accent-soft)}
.step b{display:block;font-size:14.5px;font-weight:600}
.step p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.batbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;position:sticky;top:calc(var(--nav) + 16px)}
.batbox .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.batbox .hd b{font-family:var(--mono);font-size:13px;font-weight:600}
.batbox .hd .sub{margin-left:auto;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.batbox pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.65;white-space:pre-wrap;word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;max-height:250px;overflow:auto;color:var(--ink-2)}
.batbox .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.portal-footer{border-top:1px solid var(--line);padding:24px clamp(16px,4vw,40px);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px;max-width:1120px;margin:0 auto}
.health{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.health i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.health.ok i{background:var(--ok)}.health.ok{color:var(--ok)}
.health.bad i{background:var(--bad)}.health.bad{color:var(--bad)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media(max-width:900px){.hero,.launch,.setup-grid{grid-template-columns:1fr}.batbox{position:static}.navlinks{display:none}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(odd){border-left:0;padding-left:0}.stat{border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.stat{border-left:0;padding:12px 0}.stat:first-child{border-top:0}.clock{display:none}.hero-cta .btn{flex:1}}
</style>
</head><body class="auth-locked">
<nav class="portal-nav" id="nav">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l11 11-7 7L3 10V3z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span><span><span data-i18n="app.portal"></span><small data-i18n="app.subtitle"></small></span></div>
  <div class="navlinks"><a href="#overview" class="active" data-i18n="nav.overview"></a><a href="#stations" data-i18n="nav.stations"></a><a href="#launch" data-i18n="nav.launch"></a><a href="#setup" data-i18n="nav.setup"></a></div>
  <span class="clock" id="clock">--:--:--</span>
  <a class="btn btn-blue btn-sm" href="parents-admin.html" data-i18n="portal.openAdmin"></a>
</nav>

<main class="portal">
  <section id="overview" class="hero reveal">
    <div>
      <span class="eyebrow" data-i18n="portal.eyebrow"></span>
      <h1><span data-i18n="portal.h1a"></span><br><span class="accent" data-i18n="portal.h1b"></span></h1>
      <p class="lede" data-i18n="portal.lede"></p>
      <div class="hero-cta">
        <a class="btn btn-blue" href="remote.html" data-i18n="app.remote"></a>
        <a class="btn btn-ghost" href="parents-admin.html" data-i18n="app.admin"></a>
        <a class="btn btn-ghost" href="parents-printer.html" data-i18n="app.printer"></a>
        <button class="btn btn-ghost" id="dlBatTop" data-i18n="portal.downloadBat"></button>
      </div>
      <div class="stats">
        <div class="stat"><div class="n" id="stStudents">0</div><div class="l" data-i18n="portal.students"></div></div>
        <div class="stat"><div class="n" id="stOnline">0/0</div><div class="l" data-i18n="portal.stationsOnline"></div></div>
        <div class="stat"><div class="n" id="stQueue">0</div><div class="l" data-i18n="portal.pendingLabels"></div></div>
        <div class="stat present"><div class="n" id="stPresent">0</div><div class="l" data-i18n="portal.presentToday"></div></div>
      </div>
    </div>
    <div class="hero-card">
      <div class="hero-top"><span class="tagline" data-i18n="portal.livePreview"></span><span class="hero-day" id="attDayChip">—</span></div>
      <div class="label-preview hero-preview" id="heroPreview"></div>
      <div class="att-sample"><span class="att-dot"></span><span data-i18n="common.present"></span><span class="att-time">08:02</span><span class="att-by">scan</span></div>
      <div class="hero-note" data-i18n="portal.previewNote"></div>
    </div>
  </section>

  <section id="stations" class="reveal">
    <div class="sec-head"><div><span class="eyebrow" data-i18n="portal.liveBoard"></span><h2 data-i18n="portal.printStations"></h2><p class="lede" data-i18n="portal.stationsLede"></p></div><a class="btn btn-ghost btn-sm" href="parents-admin.html#stations" data-i18n="portal.manageStations"></a></div>
    <div class="board" id="board"><div class="empty" data-i18n="portal.loadingStations"></div></div>
  </section>

  <section id="launch" class="reveal">
    <div class="sec-head"><div><span class="eyebrow" data-i18n="portal.threeEnds"></span><h2 data-i18n="portal.launchSystem"></h2></div></div>
    <div class="launch">
      <div class="launch-card"><div class="lc-top"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="idx">01</span></div><h3 data-i18n="app.admin"></h3><p data-i18n="portal.adminDesc"></p><div class="feat"><span data-i18n="admin.users"></span><span data-i18n="admin.designer"></span><span data-i18n="admin.attendance"></span><span>Excel</span></div><a class="btn btn-ghost btn-sm" href="parents-admin.html" data-i18n="portal.openAdmin"></a></div>
      <div class="launch-card"><div class="lc-top"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span><span class="idx">02</span></div><h3 data-i18n="app.remote"></h3><p data-i18n="portal.remoteDesc"></p><div class="feat"><span data-i18n="remote.presentPrint"></span><span data-i18n="common.absent"></span><span data-i18n="common.selectStation"></span></div><a class="btn btn-ghost btn-sm" href="remote.html" data-i18n="app.remote"></a></div>
      <div class="launch-card"><div class="lc-top"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></span><span class="idx">03</span></div><h3 data-i18n="app.printer"></h3><p data-i18n="portal.printerDesc"></p><div class="feat"><span data-i18n="printer.operate"></span><span data-i18n="printer.log"></span><span data-i18n="printer.settings"></span></div><a class="btn btn-ghost btn-sm" href="parents-printer.html" data-i18n="app.printer"></a></div>
    </div>
  </section>

  <section id="setup" class="reveal">
    <div class="sec-head"><div><span class="eyebrow" data-i18n="portal.deployment"></span><h2 data-i18n="portal.setupSteps"></h2></div></div>
    <div class="setup-grid">
      <div class="steps">
        <div class="step"><span class="num">1</span><div><b data-i18n="portal.step1"></b><p data-i18n="portal.step1d"></p></div></div>
        <div class="step"><span class="num">2</span><div><b data-i18n="portal.step2"></b><p data-i18n="portal.step2d"></p></div></div>
        <div class="step"><span class="num">3</span><div><b data-i18n="portal.step3"></b><p data-i18n="portal.step3d"></p></div></div>
        <div class="step"><span class="num">4</span><div><b data-i18n="portal.step4"></b><p data-i18n="portal.step4d"></p></div></div>
        <div class="step"><span class="num">5</span><div><b data-i18n="portal.step5"></b><p data-i18n="portal.step5d"></p></div></div>
      </div>
      <div class="batbox">
        <div class="hd"><b>StartLabelPrinter.bat</b><span class="sub" data-i18n="portal.bat"></span></div>
        <pre id="batCode"></pre>
        <div class="row"><button class="btn btn-blue btn-sm" id="dlBat" data-i18n="portal.downloadBat"></button><button class="btn btn-ghost btn-sm" id="cpBat" data-i18n="common.import"></button></div>
      </div>
    </div>
  </section>
</main>

<footer class="portal-footer"><span data-i18n="portal.footer"></span><span class="health" id="health"><i></i><span data-i18n="portal.waitSignIn"></span></span></footer>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/i18n.js"></script>
<script src="js/label-layout.js"></script>
<script src="js/auth.js"></script>
<script>
const $=id=>document.getElementById(id),t=(k,v)=>I18N.t(k,v),esc=LL.esc,root=Auth.root();
const toast=m=>{const el=$('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)};
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const tick=()=>{$('clock').textContent=new Date().toLocaleTimeString('en-GB')};tick();setInterval(tick,1000);
const nav=$('nav');addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>10),{passive:true});
const links=[...document.querySelectorAll('.navlinks a')];
const ioN=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});
links.forEach(a=>{const s=document.querySelector(a.getAttribute('href'));if(s)ioN.observe(s);});
const rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rio.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>rio.observe(el));
let students={},stations={},queues={},attToday={},attDay=dayKey(),attRef=null,layout=LL.norm(null);
const online=st=>st&&st.lastSeen&&(Date.now()-st.lastSeen<60000);
function renderHero(){const e=LL.eff(layout),p=$('heroPreview');p.style.width=e.w+'mm';p.style.height=e.h+'mm';p.innerHTML=LL.stageHTML(layout,layout.sample,false);}
function render(){const a=Object.entries(stations),on=a.filter(([k,v])=>online(v)).length;let pend=0;Object.values(queues).forEach(q=>pend+=Object.keys(q||{}).length);let pres=0;Object.values(attToday).forEach(x=>{if(x&&x.status==='present')pres++;});
$('stStudents').textContent=Object.keys(students).length;$('stOnline').textContent=on+'/'+a.length;$('stQueue').textContent=pend;$('stPresent').textContent=pres;
const e=LL.eff(layout),b=$('board');if(!a.length){b.innerHTML='<div class="empty">'+esc(t('portal.noStations'))+'</div>';return;}
b.innerHTML=a.map(([k,v])=>{const q=Object.keys(queues[k]||{}).length,o=online(v);return '<div class="station '+(o?'on':'off')+'"><div class="st-top"><span class="st-dot"></span><span class="st-name">'+esc(v.name||t('common.station'))+'</span><span class="st-token">'+esc(v.token||'—')+'</span></div><div class="st-meta"><span class="meta">'+esc(t('portal.eff'))+' '+e.w+'×'+e.h+' mm</span><span class="meta">'+esc(t('portal.hide'))+' '+esc(t('portal.top'))+' '+layout.hide.top+' / '+esc(t('portal.left'))+' '+layout.hide.left+' mm</span></div><div class="st-foot"><span class="'+(o?'on':'off')+'">'+esc(t(o?'common.online':'common.offline'))+'</span><span class="qbadge '+(q?'hot':'')+'">'+esc(t('common.queue'))+' '+q+'</span></div></div>';}).join('');}
function renderHealth(){const h=$('health'),ok=h.classList.contains('ok');h.querySelector('span').textContent=ok?t('portal.connected'):h.classList.contains('bad')?t('portal.disconnected'):t('portal.waitSignIn');}
renderHero();renderHealth();
Auth.start(function(){
  root.child('labelLayout').on('value',s=>{layout=LL.norm(s.val());renderHero();render();});
  const attach=d=>{if(attRef)attRef.off();attDay=d;attToday={};$('attDayChip').textContent=d;attRef=root.child('attendance/'+d);attRef.on('value',s=>{attToday=s.val()||{};render();});};
  attach(attDay);setInterval(()=>{const d=dayKey();if(d!==attDay)attach(d);},30000);
  root.child('students').on('value',s=>{students=s.val()||{};render();});
  root.child('stations').on('value',s=>{stations=s.val()||{};render();});
  root.child('queues').on('value',s=>{queues=s.val()||{};render();});
  setInterval(render,15000);
  Auth.db.ref('.info/connected').on('value',s=>{const h=$('health'),ok=s.val()===true;h.className='health '+(ok?'ok':'bad');renderHealth();});
});
function batText(){const url=location.href.replace(/[^/]*$/,'')+'parents-printer.html';return ['@echo off','start "" "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" --kiosk --kiosk-printing --user-data-dir="C:\\kiosk-profile" --app="'+url+'" --disable-features=IntensiveWakeUpThrottling --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding --no-first-run --no-default-browser-check --disable-infobars',''].join('\r\n');}
$('batCode').textContent=batText();
function dl(){const b=new Blob([batText()],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='StartLabelPrinter.bat';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast(t('portal.downloaded'));}
$('dlBat').onclick=dl;$('dlBatTop').onclick=dl;
$('cpBat').onclick=async()=>{try{await navigator.clipboard.writeText(batText());toast(t('portal.copied'))}catch(e){toast(t('portal.copyFail'))}};
