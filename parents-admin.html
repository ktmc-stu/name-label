<!-- parents-admin.html -->
<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parent Label Admin · 家長標籤管理端</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/lang.css">
</head><body class="auth-locked">

<div class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l11 11-7 7L3 10V3z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span data-i18n="app.admin"></span></div>
  <div class="right"><span class="chip" id="dataChip">—</span></div>
</div>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="grp" data-i18n="g.console"></div>
    <button data-page="overview" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl" data-i18n="p.overview"></span></button>
    <button data-page="operate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span class="lbl" data-i18n="p.operate"></span></button>
    <button data-page="designer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg><span class="lbl" data-i18n="p.designer"></span></button>
    <button data-page="attendance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg><span class="lbl" data-i18n="p.attendance"></span></button>
    <div class="grp" data-i18n="g.manage"></div>
    <button data-page="meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lbl" data-i18n="p.meetings"></span><span class="bdg ac" id="meetBdg" hidden>0</span></button>
    <button data-page="stations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span class="lbl" data-i18n="p.stations"></span></button>
    <button data-page="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg><span class="lbl" data-i18n="p.students"></span></button>
    <button data-page="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg><span class="lbl" data-i18n="p.users"></span><span class="bdg" id="userBdg" hidden>0</span></button>
    <div class="grp" data-i18n="g.system"></div>
    <button data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="lbl" data-i18n="p.settings"></span></button>
  </aside>

  <main class="main">
    <div id="banner"></div>
    <div id="denied" class="banner" style="display:none"><h4 data-i18n="dn.title"></h4><ul><li data-i18n="dn.body"></li></ul></div>

    <div id="console">
    <section class="page on" id="pg-overview">
      <div class="phead"><h2 data-i18n="p.overview"></h2><p data-i18n="d.overview"></p></div>
      <div class="ov">
        <div class="ovc"><div class="n" id="ovStu">0</div><div class="l" data-i18n="s.students"></div></div>
        <div class="ovc ac"><div class="n" id="ovMeet">0</div><div class="l" data-i18n="s.meetings"></div></div>
        <div class="ovc"><div class="n" id="ovOn">0/0</div><div class="l" data-i18n="s.online"></div></div>
        <div class="ovc"><div class="n" id="ovQ">0</div><div class="l" data-i18n="s.queue"></div></div>
        <div class="ovc ok"><div class="n" id="ovPres">0</div><div class="l" data-i18n="s.present"></div></div>
        <div class="ovc bd"><div class="n" id="ovPend">0</div><div class="l" data-i18n="s.pending"></div></div>
      </div>
      <div class="ql">
        <button data-goto="operate"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span><span><b data-i18n="p.operate"></b><small data-i18n="q.operate"></small></span></button>
        <button data-goto="meetings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span><b data-i18n="p.meetings"></b><small data-i18n="q.meet"></small></span></button>
        <button data-goto="designer"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></span><span><b data-i18n="p.designer"></b><small data-i18n="q.design"></small></span></button>
        <button data-goto="users"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span><span><b data-i18n="p.users"></b><small data-i18n="q.users"></small></span></button>
      </div>
    </section>

    <section class="page" id="pg-operate">
      <div class="phead"><h2 data-i18n="p.operate"></h2><p data-i18n="d.operate"></p></div>
      <div class="card">
        <div class="station-trigger"><button class="btn ghost sm" id="stBtn" type="button"><span class="dot" id="stDot"></span><span id="stTxt"></span><span class="mono faint" id="stQ"></span></button></div>
        <h3 data-i18n="op.scan"></h3>
        <div class="scan" id="scan"></div>
        <div class="row" style="margin-top:12px"><span class="tag" id="lastScan"></span><span class="tag" id="sentTag"></span></div>
      </div>
      <div class="card">
        <h3 data-i18n="op.manual"></h3>
        <input type="text" id="q" data-ph="op.searchPh" autocomplete="off">
        <div id="res"></div>
        <div class="help" id="bindHelp" style="display:none;margin-top:10px"></div>
      </div>
    </section>

    <section class="page" id="pg-designer">
      <div class="phead"><h2 data-i18n="p.designer"></h2><p data-i18n="d.designer"></p></div>
      <div class="dz">
        <div class="dzstage">
          <div class="dzbar">
            <div class="seg" id="modeSeg"><button data-mode="simple" class="on" data-i18n="dz.basic"></button><button data-mode="designer" data-i18n="dz.free"></button></div>
            <span class="spacer"></span>
            <select id="zoom"><option value="1">1×</option><option value="1.4" selected>1.4×</option><option value="2">2×</option><option value="2.6">2.6×</option></select>
          </div>
          <div class="dzbar" id="boxTools" style="display:none">
            <button class="btn gray mini" id="tbAdd" data-i18n="dz.add"></button>
            <button class="btn gray mini" id="tbMeet" data-i18n="dz.addMeet"></button>
            <button class="btn gray mini" id="tbDup" data-i18n="dz.dup"></button>
            <button class="btn bad mini" id="tbDel" data-i18n="dz.del"></button>
          </div>
          <div class="canvaswrap" id="canvasWrap"><div class="canvas" id="canvas"></div></div>
          <p class="muted" id="canvasHint" style="margin-top:10px" data-i18n="dz.canvasHint"></p>
          <div class="sec" style="margin-top:12px">
            <h4 data-i18n="dz.preview"></h4>
            <div class="preview" id="preview"></div>
            <p class="muted" style="margin-top:10px" id="effInfo"></p>
          </div>
        </div>
        <div>
          <div class="sec">
            <h4 data-i18n="dz.file"></h4>
            <div class="g">
              <div><label data-i18n="dz.fw"></label><input id="dcW" type="number" step="0.1" min="10"></div>
              <div><label data-i18n="dz.fh"></label><input id="dcH" type="number" step="0.1" min="10"></div>
              <div><label data-i18n="dz.ht"></label><input id="hdT" type="number" step="0.1" min="0"></div>
              <div><label data-i18n="dz.hl"></label><input id="hdL" type="number" step="0.1" min="0"></div>
            </div>
            <div class="row" style="margin-top:10px"><button class="btn gray mini" id="preset" data-i18n="dz.preset"></button></div>
          </div>
          <div class="sec" id="basicSec">
            <h4 data-i18n="dz.basicLabel"></h4>
            <div class="g">
              <div><label data-i18n="dz.top"></label><input id="bTop" type="number" step="0.1"></div>
              <div><label data-i18n="dz.side"></label><input id="bSide" type="number" step="0.1"></div>
              <div><label data-i18n="dz.en"></label><input id="bEn" type="number" step="0.5"></div>
              <div><label data-i18n="dz.zh"></label><input id="bZh" type="number" step="0.5"></div>
              <div><label data-i18n="dz.ms"></label><input id="bMs" type="number" step="0.5"></div>
              <div><label data-i18n="dz.gap"></label><input id="bGap" type="number" step="0.1"></div>
            </div>
            <div style="margin-top:10px"><label data-i18n="dz.enText"></label><input id="bEnT"></div>
            <div style="margin-top:10px"><label data-i18n="dz.zhText"></label><input id="bZhT"></div>
            <div style="margin-top:10px"><label data-i18n="dz.meetText"></label><input id="bMeT"></div>
            <p class="muted" style="margin-top:8px" data-i18n="dz.meetHint"></p>
          </div>
          <div class="sec" id="boxSec" style="display:none">
            <h4 data-i18n="dz.box"></h4>
            <div id="boxNone" class="muted" data-i18n="dz.boxHint"></div>
            <div id="boxProps" style="display:none">
              <label data-i18n="dz.content"></label><textarea id="tbText" rows="3"></textarea>
              <div class="chips" id="phChips"></div>
              <div class="g">
                <div><label>X (mm)</label><input id="tbX" type="number" step="0.1"></div>
                <div><label>Y (mm)</label><input id="tbY" type="number" step="0.1"></div>
                <div><label>W (mm)</label><input id="tbW" type="number" step="0.1"></div>
                <div><label>H (mm)</label><input id="tbH" type="number" step="0.1"></div>
                <div><label data-i18n="dz.size"></label><input id="tbSize" type="number" step="0.5"></div>
                <div><label data-i18n="dz.weight"></label><select id="tbWeight"><option>400</option><option>500</option><option>600</option><option>700</option></select></div>
                <div><label data-i18n="dz.lh"></label><input id="tbLh" type="number" step="0.05"></div>
                <div><label data-i18n="dz.ax"></label><select id="tbAx"><option value="left" data-i18n="dz.left"></option><option value="center" data-i18n="dz.center"></option><option value="right" data-i18n="dz.right"></option></select></div>
                <div><label data-i18n="dz.ay"></label><select id="tbAy"><option value="top" data-i18n="dz.vtop"></option><option value="middle" data-i18n="dz.center"></option><option value="bottom" data-i18n="dz.vbot"></option></select></div>
                <div><label data-i18n="dz.color"></label><input id="tbColor" type="color"></div>
              </div>
            </div>
          </div>
          <div class="sec">
            <h4 data-i18n="dz.sample"></h4>
            <div class="g">
              <div><label data-i18n="c.class"></label><input id="smCls"></div>
              <div><label data-i18n="c.no"></label><input id="smNo"></div>
              <div><label data-i18n="c.en"></label><input id="smEn"></div>
              <div><label data-i18n="c.zh"></label><input id="smZh"></div>
              <div><label data-i18n="c.card"></label><input id="smCard"></div>
              <div><label data-i18n="m.time"></label><input id="smTime"></div>
              <div><label data-i18n="m.teacher"></label><input id="smTeacher"></div>
              <div><label data-i18n="m.room"></label><input id="smRoom"></div>
            </div>
          </div>
          <div class="row">
            <button class="btn" id="dzSave" data-i18n="c.save"></button>
            <button class="btn gray" id="dzReset" data-i18n="c.reset"></button>
            <button class="btn gray" id="dzExport" data-i18n="dz.export"></button>
            <button class="btn gray" id="dzImport" data-i18n="dz.import"></button>
            <input type="file" id="dzFile" accept=".json" style="display:none">
          </div>
          <p class="muted" id="dzStatus" style="margin-top:10px"></p>
        </div>
      </div>
    </section>

    <section class="page" id="pg-attendance">
      <div class="phead"><h2 data-i18n="p.attendance"></h2><p data-i18n="d.attendance"></p></div>
      <div class="card">
        <div class="filters">
          <div><label data-i18n="c.date"></label><input type="date" id="attDate" style="width:auto;min-width:150px"></div>
          <div><label data-i18n="c.class"></label><select id="attCls"></select></div>
          <span class="spacer"></span>
          <button class="btn gray" id="attExport" data-i18n="a.export"></button>
          <button class="btn gray" id="attAbsAll" data-i18n="a.absAll"></button>
        </div>
        <div class="row" style="margin-bottom:12px"><span class="tag" id="attP"></span><span class="tag" id="attA"></span><span class="tag" id="attN"></span></div>
        <div class="scroll" style="max-height:600px"><table><thead><tr><th data-i18n="c.class"></th><th data-i18n="c.no"></th><th data-i18n="c.en"></th><th data-i18n="c.zh"></th><th data-i18n="m.time"></th><th data-i18n="m.teacher"></th><th data-i18n="c.status"></th><th data-i18n="c.time"></th><th data-i18n="a.by"></th><th data-i18n="c.actions"></th></tr></thead><tbody id="attBody"></tbody></table></div>
      </div>
    </section>

    <section class="page" id="pg-meetings">
      <div class="phead"><h2 data-i18n="p.meetings"></h2><p data-i18n="d.meetings"></p></div>
      <div class="card">
        <div class="filters">
          <div class="grow"><label data-i18n="c.search"></label><input type="text" id="mtQ" data-ph="m.searchPh" autocomplete="off"></div>
          <div><label data-i18n="m.teacher"></label><select id="mtTeacher"></select></div>
          <div><label data-i18n="m.room"></label><select id="mtRoom"></select></div>
          <label class="check"><input type="checkbox" id="mtOnly"><span data-i18n="m.only"></span></label>
          <span class="spacer"></span>
          <button class="btn gray" id="mtExport" data-i18n="m.export"></button>
        </div>
        <div class="row" style="margin-bottom:12px"><span class="tag" id="mtS1"></span><span class="tag" id="mtS2"></span><span class="tag" id="mtS3"></span><span class="tag" id="mtS4"></span></div>
        <div class="scroll" style="max-height:620px"><table><thead><tr><th data-i18n="c.class"></th><th data-i18n="c.no"></th><th data-i18n="c.en"></th><th data-i18n="c.zh"></th><th data-i18n="m.time"></th><th data-i18n="m.teacher"></th><th data-i18n="m.room"></th><th data-i18n="c.actions"></th></tr></thead><tbody id="mtBody"></tbody></table></div>
        <p class="muted" style="margin-top:12px" data-i18n="m.importNote"></p>
      </div>
    </section>

    <section class="page" id="pg-stations">
      <div class="phead"><h2 data-i18n="p.stations"></h2><p data-i18n="d.stations"></p></div>
      <div class="card">
        <div class="g"><div><label data-i18n="st.name"></label><input id="nsName"></div><div><label data-i18n="st.token"></label><input id="nsToken" style="text-transform:uppercase"></div></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="stAdd" data-i18n="st.add"></button></div>
        <div class="scroll" style="margin-top:14px"><table><thead><tr><th data-i18n="c.name"></th><th data-i18n="st.token"></th><th data-i18n="st.layout"></th><th data-i18n="c.status"></th><th data-i18n="c.actions"></th></tr></thead><tbody id="stBody"></tbody></table></div>
      </div>
    </section>

    <section class="page" id="pg-students">
      <div class="phead"><h2 data-i18n="p.students"></h2><p data-i18n="d.students"></p></div>
      <div class="card">
        <h3 data-i18n="sd.import"></h3>
        <p class="muted" data-i18n="sd.excel"></p>
        <p class="muted" data-i18n="m.importNote"></p>
        <div class="row" style="margin-top:6px"><input type="file" id="xls" accept=".xlsx,.xls,.csv" style="flex:1"><button class="btn gray" id="tpl" data-i18n="sd.tpl"></button></div>
        <p class="muted" id="impMsg" style="margin-top:8px"></p><hr>
        <div class="g">
          <div><label data-i18n="c.card"></label><input id="aCard"></div>
          <div><label data-i18n="c.class"></label><input id="aCls" placeholder="3A"></div>
          <div><label data-i18n="c.no"></label><input id="aNo" placeholder="15"></div>
          <div><label data-i18n="c.en"></label><input id="aEn"></div>
          <div><label data-i18n="c.zh"></label><input id="aZh"></div>
          <div><label data-i18n="m.time"></label><input id="aTime" data-ph="m.timePh"></div>
          <div><label data-i18n="m.teacher"></label><input id="aTeacher" data-ph="m.teacherPh"></div>
          <div><label data-i18n="m.room"></label><input id="aRoom" data-ph="m.roomPh"></div>
        </div>
        <div class="row" style="margin-top:10px"><button class="btn" id="stuAdd" data-i18n="sd.add"></button></div>
      </div>
      <div class="card">
        <h3 data-i18n="sd.records"></h3>
        <div class="row" style="margin-bottom:10px"><input type="text" id="dbQ" data-ph="sd.searchPh" style="max-width:340px" autocomplete="off"><span class="tag" id="dbCount"></span></div>
        <div class="scroll" style="max-height:540px"><table><thead><tr><th data-i18n="c.card"></th><th data-i18n="c.class"></th><th data-i18n="c.no"></th><th data-i18n="c.en"></th><th data-i18n="c.zh"></th><th data-i18n="m.time"></th><th data-i18n="m.teacher"></th><th data-i18n="m.room"></th><th data-i18n="c.actions"></th></tr></thead><tbody id="dbBody"></tbody></table></div>
      </div>
    </section>

    <section class="page" id="pg-users">
      <div class="phead"><h2 data-i18n="p.users"></h2><p data-i18n="d.users"></p></div>
      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <div class="seg" id="uSeg"><button data-f="pending" class="on" data-i18n="u.pending"></button><button data-f="approved" data-i18n="u.approved"></button><button data-f="rejected" data-i18n="u.rejected"></button><button data-f="all" data-i18n="c.all"></button></div>
          <span class="spacer"></span><span class="tag" id="uCount"></span>
        </div>
        <div class="scroll"><table><thead><tr><th data-i18n="c.name"></th><th data-i18n="c.email"></th><th data-i18n="c.role"></th><th data-i18n="c.status"></th><th data-i18n="c.requested"></th><th data-i18n="c.actions"></th></tr></thead><tbody id="uBody"></tbody></table></div>
        <p class="muted" style="margin-top:12px" data-i18n="u.foot"></p>
      </div>
    </section>

    <section class="page" id="pg-settings">
      <div class="phead"><h2 data-i18n="p.settings"></h2><p data-i18n="d.settings"></p></div>
      <div class="card">
        <h3 data-i18n="se.account"></h3>
