<style>
.station-trigger{padding:0 0 14px;display:flex}
#stationBtn{gap:8px;justify-content:flex-start}#stationBtn .dot{background:var(--faint)}#stationBtn .dot.on{background:var(--ok)}#stationBtn .muted{font-family:var(--mono);font-size:11px}
#stationModal .dock-row{margin:0 0 10px}#stationModal .chips{margin:10px 0 0}#stationModal .dock-hint{margin:10px 0 0}
#userDeleteModal .ud-list{margin:0;padding-left:18px;font-size:12.5px;line-height:1.75}
#userDeleteModal .ud-warn{margin-top:10px;padding-top:10px;border-top:1px solid var(--accent-line);color:var(--warn)}
#userDeleteModal .ud-uid{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.user-legacy{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-deep);margin-left:6px;white-space:nowrap}
.mode-switch button,.tabnav button{justify-content:center}
</style>
</head><body class="auth-locked">
<div class="topbar"><span><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l11 11-7 7L3 10V3z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span data-i18n="app.admin"></span></span><span class="chip" id="topChip">—</span></div>

<div class="admin-shell">

    <button class="side-link" data-page="operate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span data-i18n="admin.operate"></span></button>
    <button class="side-link" data-page="designer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg><span data-i18n="admin.designer"></span></button>
    <button class="side-link" data-page="attendance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg><span data-i18n="admin.attendance"></span></button>
    <div class="side-group" data-i18n="admin.manage"></div>
    <button class="side-link" data-page="meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="meet.nav"></span><span class="badge" id="meetBadge" hidden>0</span></button>
    <button class="side-link" data-page="stations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span data-i18n="admin.stations"></span></button>
    <button class="side-link" data-page="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span data-i18n="admin.students"></span></button>
    <button class="side-link" data-page="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg><span data-i18n="admin.users"></span><span class="badge" id="pendingBadge" hidden>0</span></button>
    <div class="side-group" data-i18n="admin.system"></div>
    <button class="side-link" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="admin.settings"></span></button>
  </aside>

  <main class="admin-main">
    <div id="adminDenied" class="admin-only-note" style="display:none" data-i18n="admin.denied"></div>

    <div id="adminConsole">
    <section class="admin-page active" id="page-overview">
      <div class="page-head"><h2 data-i18n="admin.overview"></h2><p data-i18n="admin.overviewDesc"></p></div>
      <div class="ov-grid">
        <div class="ov-card"><div class="n" id="ovStudents">0</div><div class="l" data-i18n="common.students"></div></div>
        <div class="ov-card meet"><div class="n" id="ovMeetings">0</div><div class="l" data-i18n="meet.overview"></div></div>
        <div class="ov-card"><div class="n" id="ovOnline">0/0</div><div class="l" data-i18n="portal.stationsOnline"></div></div>
        <div class="ov-card"><div class="n" id="ovQueue">0</div><div class="l" data-i18n="portal.pendingLabels"></div></div>
        <div class="ov-card ok"><div class="n" id="ovPresent">0</div><div class="l" data-i18n="portal.presentToday"></div></div>
        <div class="ov-card"><div class="n" id="ovPending">0</div><div class="l" data-i18n="admin.pendingUsers"></div></div>
      </div>
      <div class="ov-links">
        <button class="ov-link" data-goto="operate"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span><span><b data-i18n="admin.quickOperate"></b><span data-i18n="admin.quickOperateDesc"></span></span></button>
        <button class="ov-link" data-goto="meetings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span><b data-i18n="meet.quick"></b><span data-i18n="meet.quickDesc"></span></span></button>
        <button class="ov-link" data-goto="designer"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></span><span><b data-i18n="admin.quickDesigner"></b><span data-i18n="admin.quickDesignerDesc"></span></span></button>
        <button class="ov-link" data-goto="users"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span><span><b data-i18n="admin.quickUsers"></b><span data-i18n="admin.quickUsersDesc"></span></span></button>
      </div>
    </section>

    <section class="admin-page" id="page-operate">
      <div class="page-head"><h2 data-i18n="admin.operate"></h2><p data-i18n="admin.operateDesc"></p></div>
      <div class="station-trigger"><button class="btn btn-ghost btn-sm" id="stationBtn"><span class="dot" id="stBtnDot"></span><span id="stBtnText"></span><span class="muted" id="stBtnQueue"></span></button></div>
      <div class="card"><h3 data-i18n="admin.cardScan"></h3>
        <div class="scan-box" id="scanBox"></div>
        <div class="statline"><span class="tag" id="lastScan"></span><span class="tag" id="sentCount"></span></div>
      </div>
      <div class="card"><h3 data-i18n="admin.manualSearch"></h3>
        <input type="text" id="q" data-i18n-ph="admin.searchPh" autocomplete="off">
        <div id="res"></div><div class="help" id="bindHelp" style="display:none;margin-top:10px"></div>
      </div>
    </section>

    <section class="admin-page" id="page-designer">
      <div class="page-head"><h2 data-i18n="admin.designer"></h2><p data-i18n="admin.designerDesc"></p></div>
      <div class="card" id="designer"><h3 data-i18n="admin.labelSettingsDesigner"></h3>
        <div class="row" style="margin-bottom:14px"><div class="mode-switch"><button id="modeBasic" class="active" data-i18n="admin.basic"></button><button id="modeDesigner" data-i18n="admin.designerMode"></button></div><span class="muted" id="dzModeHint"></span></div>
        <div class="designer">
          <div class="dz-section"><h4 data-i18n="admin.fileHideEff"></h4>
            <div class="g">
              <div><label data-i18n="admin.fileW"></label><input id="dcW" type="number" step="0.1" min="10"></div>
              <div><label data-i18n="admin.fileH"></label><input id="dcH" type="number" step="0.1" min="10"></div>
              <div><label data-i18n="admin.hideTop"></label><input id="hdTop" type="number" step="0.1" min="0"></div>
              <div><label data-i18n="admin.hideLeft"></label><input id="hdLeft" type="number" step="0.1" min="0"></div>
            </div>
            <p class="muted" id="effInfo" style="margin-top:10px"></p>
            <div class="row" style="margin-top:8px"><button class="btn-gray mini" id="dcPreset" data-i18n="admin.preset"></button></div>
          </div>
          <div class="dz-section" id="basicBox"><h4 data-i18n="admin.basicLabel"></h4>
            <div class="g">
              <div><label data-i18n="admin.topMargin"></label><input id="bsTop" type="number" step="0.1"></div>
              <div><label data-i18n="admin.sideMargin"></label><input id="bsSide" type="number" step="0.1"></div>
              <div><label data-i18n="admin.enSize"></label><input id="bsEn" type="number" step="0.5"></div>
              <div><label data-i18n="admin.zhSize"></label><input id="bsZh" type="number" step="0.5"></div>
              <div><label data-i18n="admin.meetSize"></label><input id="bsMeetSize" type="number" step="0.5"></div>
              <div><label data-i18n="admin.gap"></label><input id="bsGap" type="number" step="0.1"></div>
            </div>
            <div class="g" style="margin-top:10px">
              <div style="grid-column:1/-1"><label data-i18n="admin.enText"></label><input id="bsEnText"></div>
              <div style="grid-column:1/-1"><label data-i18n="admin.zhText"></label><input id="bsZhText"></div>
              <div style="grid-column:1/-1"><label data-i18n="admin.meetText"></label><input id="bsMeetText"></div>
            </div>
            <p class="muted" style="margin-top:8px" data-i18n="admin.meetHint"></p>
          </div>
          <div id="designerBox" style="display:none">
            <div class="dz-toolbar"><button class="btn-gray mini" id="dzAdd" data-i18n="admin.addText"></button><button class="btn-gray mini" id="dzAddMeet" data-i18n="meet.editTitle"></button><button class="btn-gray mini" id="dzDup" data-i18n="admin.duplicate"></button><button class="btn-red mini" id="dzDel" data-i18n="admin.deleteText"></button><span class="spacer"></span><label><span data-i18n="admin.zoom"></span> <select id="dzZoom"><option value="1">1×</option><option value="1.4" selected>1.4×</option><option value="2">2×</option><option value="2.6">2.6×</option></select></label></div>
            <div class="dz-canvas-wrap"><div class="dz-canvas" id="dzCanvas"></div></div>
            <div class="dz-hint" data-i18n="admin.canvasHint"></div>
            <div class="dz-section" style="margin-top:12px"><h4 data-i18n="admin.textBox"></h4>
              <div id="dzNoSel" class="muted" data-i18n="admin.selectBoxHint"></div>
              <div id="dzProps" style="display:none">
                <div class="att-field"><label data-i18n="admin.content"></label><textarea id="dzText" rows="3"></textarea></div>
                <div class="dz-chips" id="dzChips"></div>
                <div class="g">
                  <div><label>X (mm)</label><input id="dzX" type="number" step="0.1"></div><div><label>Y (mm)</label><input id="dzY" type="number" step="0.1"></div>
                  <div><label>W (mm)</label><input id="dzW" type="number" step="0.1"></div><div><label>H (mm)</label><input id="dzH" type="number" step="0.1"></div>
                  <div><label data-i18n="admin.fontPx"></label><input id="dzSize" type="number" step="0.5"></div>
                  <div><label data-i18n="admin.weight"></label><select id="dzWeight"><option>400</option><option>500</option><option>600</option><option>700</option></select></div>
                  <div><label data-i18n="admin.lineHeight"></label><input id="dzLine" type="number" step="0.05"></div>
                  <div><label data-i18n="admin.alignX"></label><select id="dzAlign"><option value="left" data-i18n="admin.alignLeft"></option><option value="center" data-i18n="admin.alignCenter"></option><option value="right" data-i18n="admin.alignRight"></option></select></div>
                  <div><label data-i18n="admin.alignY"></label><select id="dzValign"><option value="top" data-i18n="admin.valignTop"></option><option value="middle" data-i18n="admin.valignMiddle"></option><option value="bottom" data-i18n="admin.valignBottom"></option></select></div>
                  <div><label data-i18n="admin.color"></label><input id="dzColor" type="color"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="dz-section"><h4 data-i18n="admin.previewEff"></h4>
            <div class="dz-preview-wrap"><div class="label-preview" id="dzPreview"></div></div>
            <p class="muted" id="dzInfo" style="margin-top:8px"></p>
            <h4 style="margin-top:12px" data-i18n="admin.sampleData"></h4>
            <div class="g">
              <div><label data-i18n="common.class"></label><input id="smCls"></div><div><label data-i18n="common.classNo"></label><input id="smNo"></div>
              <div><label data-i18n="common.english"></label><input id="smEn"></div><div><label data-i18n="common.chinese"></label><input id="smZh"></div>
              <div><label data-i18n="common.cardId"></label><input id="smCard"></div>
              <div><label data-i18n="meet.time"></label><input id="smMeetTime"></div>
              <div><label data-i18n="meet.teacher"></label><input id="smMeetTeacher"></div>
              <div><label data-i18n="meet.room"></label><input id="smMeetRoom"></div>
            </div>
          </div>
          <div class="dz-actions"><button id="dzSave" data-i18n="common.save"></button><button class="btn-gray" id="dzReset" data-i18n="common.reset"></button><button class="btn-gray" id="dzExport" data-i18n="admin.exportJson"></button><button class="btn-gray" id="dzImport" data-i18n="admin.importJson"></button><input type="file" id="dzImportFile" accept=".json" style="display:none"></div>
          <p class="muted" id="dzStatus" style="margin:0"></p>
        </div>
      </div>
    </section>

    <section class="admin-page" id="page-attendance">
      <div class="page-head"><h2 data-i18n="admin.attendance"></h2><p data-i18n="admin.attendanceDesc"></p></div>
      <div class="card">
        <div class="att-controls">
          <div class="att-field"><label data-i18n="common.date"></label><input type="date" id="attDate"></div>
          <div class="att-field"><label data-i18n="common.class"></label><select id="attCls"></select></div>
          <span class="spacer"></span><button class="btn-gray" id="btnAttExport" data-i18n="admin.exportExcel"></button><button class="btn-gray" id="btnAbsAll" data-i18n="admin.markAllAbsent"></button>
        </div>
        <div class="statline" style="margin:0 0 12px"><span class="tag" id="attP"></span><span class="tag" id="attA"></span><span class="tag" id="attN"></span></div>
        <div style="overflow:auto;max-height:560px"><table><thead><tr><th data-i18n="common.class"></th><th data-i18n="common.classNo"></th><th data-i18n="common.english"></th><th data-i18n="common.chinese"></th><th data-i18n="common.status"></th><th data-i18n="common.time"></th><th data-i18n="admin.by"></th><th data-i18n="common.actions"></th></tr></thead><tbody id="attBody"></tbody></table></div>
      </div>
    </section>

    <section class="admin-page" id="page-meetings">
      <div class="page-head"><h2 data-i18n="meet.title"></h2><p data-i18n="meet.desc"></p></div>
      <div class="card">
        <div class="meet-controls">
          <div class="att-field grow"><label data-i18n="meet.search"></label><input type="text" id="mtSearch" data-i18n-ph="meet.searchPh" autocomplete="off"></div>
          <div class="att-field"><label data-i18n="meet.teacher"></label><select id="mtTeacher"></select></div>
          <div class="att-field"><label data-i18n="meet.room"></label><select id="mtRoom"></select></div>
          <label class="meet-check"><input type="checkbox" id="mtOnly"><span data-i18n="meet.onlyScheduled"></span></label>
          <span class="spacer"></span>
          <button class="btn-gray" id="mtExport" data-i18n="meet.export"></button>
        </div>
        <div class="statline" style="margin:0 0 12px"><span class="tag" id="mtStatScheduled"></span><span class="tag" id="mtStatUnscheduled"></span><span class="tag" id="mtStatTeachers"></span><span class="tag" id="mtStatRooms"></span></div>
        <div style="overflow:auto;max-height:600px"><table><thead><tr><th data-i18n="common.class"></th><th data-i18n="common.classNo"></th><th data-i18n="common.english"></th><th data-i18n="common.chinese"></th><th data-i18n="meet.time"></th><th data-i18n="meet.teacher"></th><th data-i18n="meet.room"></th><th data-i18n="common.actions"></th></tr></thead><tbody id="mtBody"></tbody></table></div>
        <p class="muted" style="margin-top:12px" data-i18n="meet.importNote"></p>
      </div>
    </section>

    <section class="admin-page" id="page-stations">
      <div class="page-head"><h2 data-i18n="admin.stations"></h2><p data-i18n="admin.stationsDesc"></p></div>
      <div class="card">
        <div class="g"><div><label data-i18n="admin.stationName"></label><input id="nsName"></div><div><label data-i18n="admin.stationToken"></label><input id="nsToken" style="text-transform:uppercase"></div></div>
        <div class="row" style="margin-top:10px"><button id="btnAddStation" data-i18n="admin.addStation"></button></div>
        <div style="overflow:auto;margin-top:14px"><table><thead><tr><th data-i18n="common.name"></th><th data-i18n="admin.stationToken"></th><th data-i18n="admin.layout"></th><th data-i18n="common.status"></th><th data-i18n="common.actions"></th></tr></thead><tbody id="stBody"></tbody></table></div>
      </div>
    </section>

    <section class="admin-page" id="page-students">
      <div class="page-head"><h2 data-i18n="admin.students"></h2><p data-i18n="admin.studentsDesc"></p></div>
      <div class="card"><h3 data-i18n="admin.importAdd"></h3>
        <p class="muted" data-i18n="admin.excelHeader"></p>
        <p class="muted" data-i18n="meet.importNote"></p>
        <div class="row" style="margin-top:6px"><input type="file" id="fExcel" accept=".xlsx,.xls,.csv" style="flex:1"><button class="btn-gray" id="btnTpl" data-i18n="admin.template"></button></div>
        <p class="muted" id="impMsg" style="margin-top:8px"></p><hr>
        <div class="g">
          <div><label data-i18n="common.cardId"></label><input id="aCard"></div><div><label data-i18n="common.class"></label><input id="aCls" placeholder="3A"></div><div><label data-i18n="common.classNo"></label><input id="aNo" placeholder="15"></div>
          <div><label data-i18n="common.english"></label><input id="aEn"></div><div><label data-i18n="common.chinese"></label><input id="aZh"></div>
          <div><label data-i18n="meet.time"></label><input id="aMeetTime" data-i18n-ph="meet.timePh"></div>
          <div><label data-i18n="meet.teacher"></label><input id="aMeetTeacher" data-i18n-ph="meet.teacherPh"></div>
          <div><label data-i18n="meet.room"></label><input id="aMeetRoom" data-i18n-ph="meet.roomPh"></div>
        </div>
        <div class="row" style="margin-top:10px"><button id="btnAdd" data-i18n="admin.addUpdate"></button></div>
      </div>
      <div class="card"><h3 data-i18n="admin.studentRecords"></h3>
        <div class="row" style="margin-bottom:10px"><input type="text" id="dbSearch" data-i18n-ph="admin.searchRecordsPh" style="max-width:340px" autocomplete="off"><span class="tag" id="dbCount"></span></div>
