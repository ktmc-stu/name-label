<!-- parents-printer.html -->
<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parent Printer · 標籤列印端</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lang.css">
<style id="labelCss"></style>
</head><body class="auth-locked">
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span data-i18n="app.printer"></span></div>
  <div class="right"><span class="chip" id="stationChip"></span></div>
</div>

<div class="admin-wrap">
  <div class="card" id="bindCard">
    <h3 data-i18n="st.setup"></h3>
    <div class="bind-box">
      <p class="muted" style="margin-top:0" data-i18n="st.bindHint"></p>
      <div class="g" style="margin-top:10px">
        <div><label data-i18n="st.token"></label><input id="bToken" placeholder="e.g. LAB1" style="text-transform:uppercase"></div>
        <div><label data-i18n="st.newName"></label><input id="bName"></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn" id="btnBind" data-i18n="st.bind"></button><button class="btn warn" id="btnCreate" data-i18n="st.create"></button></div>
      <p class="muted" id="bindMsg" style="margin-top:8px"></p>
    </div>
  </div>

  <div id="mainArea" style="display:none">
    <div class="card status-strip"><span class="dot" id="dot"></span><b id="statusText" style="font-size:15px;font-weight:500"></b><span class="chip" id="queueChip" style="margin-left:auto"></span></div>
    <div class="tabnav" id="tabs"><button data-tab="operate" class="on" data-i18n="pr.operate"></button><button data-tab="log" data-i18n="pr.log"></button><button data-tab="settings" data-i18n="pr.settings"></button></div>

    <div class="tabpanel on" id="tab-operate">
      <div class="card"><h3 data-i18n="pr.scan"></h3><div class="scan" id="scan"></div><div class="row" style="margin-top:10px"><span class="tag" id="opAtt"></span></div></div>
      <div class="card"><h3 data-i18n="pr.manual"></h3><p class="muted" data-i18n="pr.manualHint"></p><input type="text" id="q" data-ph="op.searchPh" autocomplete="off"><div id="res"></div></div>
    </div>

    <div class="tabpanel" id="tab-log"><div class="card"><h3 data-i18n="pr.printLog"></h3><div class="log" id="log"></div></div></div>

    <div class="tabpanel" id="tab-settings">
      <div class="card">
        <h3 data-i18n="pr.labelSettings"></h3>
        <p class="muted" id="lyInfo"></p>
        <div class="preview" id="prev"></div>
        <div class="g" style="margin-top:14px">
          <div><label data-i18n="dz.fw"></label><input id="pDcW" type="number" step="0.1" min="10"></div>
          <div><label data-i18n="dz.fh"></label><input id="pDcH" type="number" step="0.1" min="10"></div>
          <div><label data-i18n="dz.ht"></label><input id="pHdT" type="number" step="0.1" min="0"></div>
          <div><label data-i18n="dz.hl"></label><input id="pHdL" type="number" step="0.1" min="0"></div>
        </div>
        <div id="pBasic">
          <div class="g" style="margin-top:12px">
            <div><label data-i18n="dz.top"></label><input id="pTop" type="number" step="0.1"></div>
            <div><label data-i18n="dz.side"></label><input id="pSide" type="number" step="0.1"></div>
            <div><label data-i18n="dz.en"></label><input id="pEn" type="number" step="0.5"></div>
            <div><label data-i18n="dz.zh"></label><input id="pZh" type="number" step="0.5"></div>
            <div><label data-i18n="dz.ms"></label><input id="pMs" type="number" step="0.5"></div>
            <div><label data-i18n="dz.gap"></label><input id="pGap" type="number" step="0.1"></div>
          </div>
          <div style="margin-top:10px"><label data-i18n="dz.enText"></label><input id="pEnT"></div>
          <div style="margin-top:10px"><label data-i18n="dz.zhText"></label><input id="pZhT"></div>
          <div style="margin-top:10px"><label data-i18n="dz.meetText"></label><input id="pMeT"></div>
          <p class="muted" style="margin-top:8px" data-i18n="dz.meetHint"></p>
        </div>
        <p class="muted" id="pDesignerNote" style="display:none;margin-top:10px" data-i18n="pr.designerNote"></p>
        <div class="row" style="margin-top:12px"><button class="btn" id="btnSaveCfg" data-i18n="pr.saveSettings"></button><button class="btn gray" id="btnPreset" data-i18n="dz.preset"></button><a class="btn gray" href="parents-admin.html#designer" data-i18n="pr.openDesigner"></a></div>
        <p class="muted" style="margin-top:10px" data-i18n="pr.previewNote"></p>
      </div>
      <div class="card"><h3 data-i18n="pr.station"></h3><p class="muted" id="stInfo"></p><div class="row"><button class="btn warn" id="btnTest" data-i18n="pr.test"></button><button class="btn gray" id="btnClear" data-i18n="pr.clear"></button><button class="btn gray" id="btnUnbind" data-i18n="st.change"></button></div></div>
    </div>
  </div>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-meet.js"></script>
<script src="js/label-layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/printer.js"></script>
</body></html>
