<!-- remote.html -->
<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote · 遙控終端</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lang.css">
<style>.station-trigger{max-width:660px;margin:0 auto;padding:12px 14px 0;display:flex}#stBtn{justify-content:flex-start;gap:8px}#stBtn .dot{background:var(--faint)}#stBtn .dot.on{background:var(--ok)}</style>
</head><body class="auth-locked">
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span data-i18n="app.remote"></span></div>
  <div class="right"><span class="chip" id="dayChip">—</span></div>
</div>

<div class="station-trigger"><button class="btn ghost sm" id="stBtn" type="button"><span class="dot" id="stDot"></span><span id="stTxt"></span><span class="mono faint" id="stQ"></span></button></div>

<div class="remote-wrap">
  <div class="card">
    <h3 data-i18n="rm.today"></h3>
    <div class="row" style="gap:8px"><span class="tag" id="sP"></span><span class="tag" id="sA"></span><span class="tag" id="sN"></span><span class="tag" id="sM"></span></div>
    <p class="muted" style="margin-top:10px" data-i18n="rm.noReader"></p>
  </div>
  <div class="card">
    <h3 data-i18n="rm.search"></h3>
    <input type="text" id="q" data-ph="m.searchPh" autocomplete="off">
    <div id="res"></div>
  </div>
  <div class="card"><h3 data-i18n="rm.session"></h3><div class="session" id="session"><div>—</div></div></div>
</div>

<div class="scrim" id="stModal"><div class="modal" role="dialog" aria-modal="true">
  <h3 data-i18n="c.selectStation"></h3>
  <div class="row"><select id="stSel" style="flex:1 1 220px"></select><span class="pill off" id="stPill"></span><span class="tag" id="stQI"></span></div>
  <div class="row" id="stChips" style="margin-top:12px"></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn gray" id="stClose" data-i18n="c.close"></button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-meet.js"></script>
<script src="js/label-layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/remote.js"></script>
</body></html>
