<!doctype html><html lang="zh-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote 手持終端 · 列印及點名</title>
<link rel="stylesheet" href="css/style.css">
<style>
.station-trigger{max-width:640px;margin:0 auto;padding:12px 14px 0;display:flex}
#stationBtn{gap:8px}#stationBtn .dot{background:var(--faint)}#stationBtn .dot.on{background:var(--ok)}#stationBtn .muted{font-family:var(--mono);font-size:11px}
#stationModal .dock-row{margin:0 0 10px}#stationModal .chips{margin:10px 0 0}
</style>
</head><body class="auth-locked">
<div class="topbar"><span><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Remote 手持終端</span><span class="chip" id="dayChip">—</span></div>

<div class="station-trigger"><button class="btn btn-ghost btn-sm" id="stationBtn"><span class="dot" id="stBtnDot"></span><span id="stBtnText">未選擇站點 Select station</span><span class="muted" id="stBtnQueue"></span></button></div>
<div class="modal-scrim" id="stationModal" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true">
  <h3>選擇列印站 Select station</h3>
  <div class="dock-row"><select id="stationSel"><option value="">— 選擇列印站 Select station —</option></select><span class="dock-meta"><span class="pill off" id="onlinePill">未選擇</span><span id="queueInfo">queue 0</span></span></div>
  <div class="chips" id="stationChips"></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn-gray" id="stationClose">Close 關閉</button></div>
</div></div>

<div class="remote-wrap">
  <div class="card"><h3>Today 今天點名</h3>
    <div class="row" style="gap:8px"><span class="tag" id="sP">出席 0</span><span class="tag" id="sA">缺席 0</span><span class="tag" id="sN">未點名 0</span></div>
    <p class="muted" style="margin-top:10px">手持終端不支援刷卡：搜尋學生後按按鈕。「出席 + 列印」會記錄出席時間並送出標籤；未選列印站時只點名。</p>
  </div>
  <div class="card"><h3>Search 搜尋學生</h3>
    <input type="text" id="q" placeholder="姓名 / 班別 / 班號 / 卡號 …（例如 3A 15）" autocomplete="off">
    <div id="res"></div>
  </div>
  <div class="card"><h3>Session 本次操作</h3><div class="session" id="session"><div>—</div></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== auth gate ===== */
(function(){
const CFG={apiKey:"AIzaSyCUL7DTytCGPc9jDF49GRLS0DznsZoiomM",authDomain:"name-label.firebaseapp.com",databaseURL:"https://name-label-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"name-label",storageBucket:"name-label.firebasestorage.app",messagingSenderId:"520022563247",appId:"1:520022563247:web:9a7867b8ec843185ceb75a"};
if(!firebase.apps.length)firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.database();let started=false,fn=null,admin=false,claiming=false;
const st=document.createElement('style');st.textContent='#authGate{position:fixed;inset:0;z-index:30000;background:#f3f7fc;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;color:#10233c}#authGate .c{width:min(400px,100%);background:#fff;border:1px solid #dce7f4;border-radius:14px;padding:28px;box-shadow:0 18px 50px rgba(16,44,78,.14)}#authGate .mk{width:38px;height:38px;border-radius:10px;background:#0a66d0;color:#fff;display:grid;place-items:center;margin-bottom:14px}#authGate h2{margin:0 0 4px;font-size:19px;font-weight:600}#authGate .sub{margin:0 0 18px;font-size:13px;color:#5c7492}#authGate label{display:block;font-size:12px;font-weight:500;color:#5c7492;margin-bottom:5px}#authGate input{width:100%;box-sizing:border-box;font-size:15px;font-family:inherit;border:1px solid #c4d6ea;border-radius:8px;padding:10px 14px;min-height:44px;outline:none;margin-bottom:14px}#authGate input:focus{border-color:#0a66d0;box-shadow:0 0 0 3px rgba(10,102,208,.18)}#authGate button{font-family:inherit;font-size:14px;font-weight:500;border:0;border-radius:8px;padding:11px 18px;min-height:44px;cursor:pointer;background:#0a66d0;color:#fff;width:100%}#authGate button:hover{background:#0851a8}#authGate button:disabled{opacity:.5}#authGate .err{margin:12px 0 0;font-size:12.5px;color:#c23b3b;min-height:18px}#authGate .ok{color:#177a4c}#authGate .foot{margin-top:16px;padding-top:14px;border-top:1px solid #e9f0f9;font-size:12px;color:#8ea4bf;line-height:1.6}#authGate .r{display:flex;justify-content:space-between;margin-top:10px}#authGate .lk{background:none;color:#0851a8;font-size:12.5px;padding:0;min-height:0;width:auto}#authGate .lk:hover{background:none;text-decoration:underline}#authBar{display:inline-flex;align-items:center;gap:8px;flex:none}#authBar .m{font-size:11.5px;color:#5c7492;font-family:ui-monospace,Menlo,monospace;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#authBar .ro{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid #bfe3cf;background:#e6f5ed;color:#177a4c}#authBar .ro.r{border-color:#c4d6ea;background:#edf3fb;color:#5c7492}#authBar button{font-size:12.5px;border:1px solid #c4d6ea;background:#edf3fb;color:#28425f;border-radius:6px;padding:5px 11px;cursor:pointer;width:auto;min-height:0}body.auth-locked main,body.auth-locked .wrap,body.auth-locked .admin-wrap,body.auth-locked .remote-wrap,body.auth-locked .station-trigger{visibility:hidden}';document.head.appendChild(st);
const g=document.createElement('div');g.id='authGate';
g.innerHTML='<div class="c"><div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l11 11-7 7L3 10V3z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div><h2 id="agT">登入 Sign in</h2><p class="sub">家長標籤及考勤系統 · 電郵密碼登入</p><label>Email 電郵</label><input id="agE" type="email" autocomplete="username" placeholder="you@school.edu.hk"><label>Password 密碼</label><input id="agP" type="password" autocomplete="current-password" placeholder="至少 6 個字元"><button id="agB">Sign in 登入</button><p class="err" id="agR"></p><div class="r"><button class="lk" id="agS">首次使用？建立帳戶</button><button class="lk" id="agF">忘記密碼</button></div><div class="foot">第一個建立嘅帳戶自動成為管理員。之後嘅帳戶預設唯讀，管理員可喺 Firebase Data 加 admins/UID = true 授權。</div></div>';
document.body.appendChild(g);
const $=i=>document.getElementById(i);let mode='in';
const MSG={'auth/invalid-email':'電郵格式不正確。','auth/user-not-found':'找不到帳戶，請先建立。','auth/wrong-password':'密碼錯誤。','auth/invalid-credential':'電郵或密碼錯誤。','auth/invalid-login-credentials':'電郵或密碼錯誤。','auth/email-already-in-use':'電郵已註冊，請直接登入。','auth/weak-password':'密碼至少 6 個字元。','auth/too-many-requests':'嘗試過多，請稍後。','auth/network-request-failed':'網絡失敗。','auth/operation-not-allowed':'請先到 Firebase 啟用電郵密碼登入。'};
function setMode(m){mode=m;$('agT').textContent=m==='in'?'登入 Sign in':'建立帳戶 Create account';$('agB').textContent=m==='in'?'Sign in 登入':'Create 建立帳戶';$('agS').textContent=m==='in'?'首次使用？建立帳戶':'已有帳戶？返回登入';$('agR').textContent='';}
function err(t,ok){$('agR').textContent=t;$('agR').className='err'+(ok?' ok':'');}
async function submit(){const e=$('agE').value.trim(),p=$('agP').value;if(!e||!p)return err('請輸入電郵及密碼。');$('agB').disabled=true;$('agB').textContent='處理中…';
try{if(mode==='in')await auth.signInWithEmailAndPassword(e,p);else await auth.createUserWithEmailAndPassword(e,p);}catch(x){$('agB').disabled=false;setMode(mode);err(MSG[x.code]||('失敗：'+(x.code||x.message)));}}
$('agB').onclick=submit;$('agS').onclick=()=>setMode(mode==='in'?'up':'in');
$('agF').onclick=()=>{const e=$('agE').value.trim();if(!e)return err('請先輸入電郵。');auth.sendPasswordResetEmail(e).then(()=>err('已發送重設電郵至 '+e,true)).catch(x=>err(MSG[x.code]||x.message));};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&g.style.display!=='none'&&(e.target.id==='agP'||e.target.id==='agE'))submit();});
function bar(u){const tb=document.querySelector('.topbar');if(!tb)return;let b=$('authBar');if(!b){b=document.createElement('span');b.id='authBar';tb.appendChild(b);}b.innerHTML='<span class="ro'+(admin?'':' r')+'">'+(admin?'Admin':'Read-only')+'</span><span class="m">'+(u.email||'')+'</span><button id="agOut">登出</button>';$('agOut').onclick=()=>auth.signOut().then(()=>location.reload());}
async function claim(u){if(claiming)return;claiming=true;try{const own=await db.ref('admins/'+u.uid).once('value');if(own.val()===true)admin=true;else{await db.ref('admins/'+u.uid).set(true);admin=true;}}catch(e){admin=false;}claiming=false;}
auth.onAuthStateChanged(async u=>{if(!u){admin=false;started=false;document.body.classList.add('auth-locked');g.style.display='flex';setMode('in');const b=$('authBar');if(b)b.remove();return;}
$('agB').disabled=true;await claim(u);g.style.display='none';document.body.classList.remove('auth-locked');bar(u);if(!started&&fn){started=true;fn(u,admin);}});
window.Auth={auth,db,root:()=>db.ref('parents'),isAdmin:()=>admin,start(f){fn=f;if(auth.currentUser&&!started){started=true;f(auth.currentUser,admin);}}};
})();
/* ===== remote app ===== */
const $=id=>document.getElementById(id),rootRef=Auth.root();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);};
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtT=ts=>ts?new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'—';
const LS='parentRemoteStation',isOnline=st=>st&&st.lastSeen&&(Date.now()-st.lastSeen<60000);
const guard=()=>{if(!Auth.isAdmin()){toast('此帳戶為唯讀，請聯絡管理員授權');return false;}return true;};
const werr=e=>{const c=(e&&e.code)||'';toast(/PERMISSION_DENIED/i.test(c+e)?'寫入被拒：帳戶未獲授權':'操作失敗：'+(e.message||e));};
let students={},stations={},queues={},selKey=localStorage.getItem(LS)||null,att={},attDay=dayKey(),attRef=null,busy=false;
const queueCount=k=>Object.keys(queues[k]||{}).length;
function sess(m){const d=document.createElement('div');d.textContent='['+fmtT(Date.now())+'] '+m;const s=$('session');if(s.firstChild&&s.firstChild.textContent==='—')s.innerHTML='';s.prepend(d);while(s.children.length>12)s.lastChild.remove();}
function searchMatch(s,q){const t=String(q||'').split(/[\s,，、/\-]+/).filter(Boolean);if(!t.length)return false;const cls=String(s.cls||'').toLowerCase(),no=String(s.classNo||'').toLowerCase(),noS=no.replace(/^0+/,'')||no,card=String(s.cardId||'').toLowerCase(),cardS=card.replace(/^0+/,'')||card,en=String(s.nameEn||'').toLowerCase(),zh=String(s.nameZh||'').toLowerCase();const h=[en,zh,cls,no,noS,card,cardS,cls+no,cls+' '+no,cls+noS,cls+' '+noS,en+' '+zh,zh+' '+en];return t.every(x=>{if(h.some(y=>y.includes(x)))return true;if(/^\d+$/.test(x)){const z=x.replace(/^0+/,'')||x;return h.some(y=>y.includes(z));}return false;});}
function attachAtt(day){if(attRef)attRef.off();attDay=day;att={};$('dayChip').textContent=day;attRef=rootRef.child('attendance/'+day);attRef.on('value',s=>{att=s.val()||{};renderStats();doSearch();},werr);}
async function markAtt(k,status){const s=students[k];if(!s)return;await rootRef.child('attendance/'+attDay+'/'+k).set({status,time:Date.now(),by:'remote',cls:s.cls||'',classNo:s.classNo||'',nameEn:s.nameEn||'',nameZh:s.nameZh||'',cardId:s.cardId||''});}
function renderStats(){let p=0,a=0;Object.values(att).forEach(r=>r.status==='present'?p++:a++);$('sP').textContent='出席 '+p;$('sA').textContent='缺席 '+a;$('sN').textContent='未點名 '+Math.max(0,Object.keys(students).length-p-a);}
const attBadge=a=>a?(a.status==='present'?'<span class="att-badge p">出席 <span class="att-t">'+fmtT(a.time)+'</span></span>':'<span class="att-badge a">缺席 <span class="att-t">'+fmtT(a.time)+'</span></span>'):'<span class="att-badge">未點名</span>';
function renderDock(){const e=Object.entries(stations),sel=$('stationSel');sel.innerHTML='<option value="">— 選擇列印站 Select station —</option>'+e.map(([k,v])=>'<option value="'+k+'">'+esc(v.name)+' ('+esc(v.token)+')</option>').join('');sel.value=selKey||'';
$('stationChips').innerHTML=e.map(([k,v])=>{const on=isOnline(v),q=queueCount(k);return '<button class="st-chip '+(k===selKey?'active':'')+' '+(on?'on':'off')+'" data-k="'+k+'"><span class="dot"></span><span>'+esc(v.name)+'</span><span class="tk">'+esc(v.token)+'</span><span class="q">'+q+'</span></button>';}).join('')||'<span class="dock-empty">尚未建立站點，請到 Admin 新增。</span>';
const st=stations[selKey],pill=$('onlinePill');if(!st){pill.textContent='未選擇 Not selected';pill.className='pill off';}else if(isOnline(st)){pill.textContent='在線 Online';pill.className='pill';}else{pill.textContent='離線 Offline';pill.className='pill off';}
$('queueInfo').textContent='queue '+(selKey?queueCount(selKey):0);const on=selKey&&isOnline(st);
$('stBtnText').textContent=selKey&&st?st.name:'未選擇站點 Select station';$('stBtnDot').className='dot'+(on?' on':'');$('stBtnQueue').textContent='queue '+(selKey?queueCount(selKey):0);}
function openStation(){$('stationModal').classList.add('open');}function closeStation(){$('stationModal').classList.remove('open');}
function selectStation(k){selKey=k&&stations[k]?k:null;if(selKey){localStorage.setItem(LS,selKey);toast('已選擇站點：'+stations[selKey].name);}else localStorage.removeItem(LS);renderDock();closeStation();}
$('stationBtn').onclick=openStation;$('stationClose').onclick=closeStation;
$('stationSel').onchange=function(){selectStation(this.value||null);};
$('stationChips').onclick=e=>{const b=e.target.closest('.st-chip');if(b)selectStation(b.dataset.k);};
$('stationModal').addEventListener('click',e=>{if(e.target===$('stationModal'))closeStation();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('stationModal').classList.contains('open'))closeStation();});
$('q').addEventListener('input',doSearch);
function doSearch(){const q=$('q').value.trim().toLowerCase();if(!q){$('res').innerHTML='<p class="muted" style="margin-top:10px">輸入關鍵字開始搜尋。</p>';return;}const hits=Object.entries(students).filter(([k,s])=>searchMatch(s,q)).slice(0,30);
$('res').innerHTML=hits.map(([k,s])=>'<div class="stu-card"><div class="stu-head"><span class="stu-name">'+esc(s.nameEn)+'</span><span class="stu-sub">'+esc(s.nameZh)+'</span><span class="stu-sub">'+esc(s.cls||'')+' '+esc(s.classNo||'')+'</span>'+attBadge(att[k])+'</div><div class="act-row"><button class="btn-lg" onclick="rLabel(\''+k+'\')">出席 + 列印</button><button class="btn-lg btn-ok" onclick="rMark(\''+k+'\',\'present\')">出席</button><button class="btn-lg btn-red" onclick="rMark(\''+k+'\',\'absent\')">缺席</button></div></div>').join('')||'<p class="muted" style="margin-top:10px">No match 無匹配結果</p>';}
window.rMark=async(k,status)=>{if(!guard())return;const s=students[k];if(!s)return;try{await markAtt(k,status);toast((status==='present'?'已點名：出席 ':'已標記：缺席 ')+s.nameEn);sess(s.nameEn+' '+(status==='present'?'出席':'缺席'));}catch(e){werr(e);}};
window.rLabel=async k=>{if(!guard())return;if(busy)return;busy=true;try{const s=students[k];if(!s)return;await markAtt(k,'present');if(selKey&&stations[selKey]){await new Promise(r=>setTimeout(r,2000));await rootRef.child('queues/'+selKey).push({type:'label',cls:s.cls||'',classNo:s.classNo||'',nameEn:s.nameEn||'',nameZh:s.nameZh||'',cardId:s.cardId||'',copies:1,createdAt:Date.now(),done:false});toast('已點名並送至 '+stations[selKey].name);sess(s.nameEn+' 出席 + 列印 → '+stations[selKey].name);}else{toast('已點名（未選列印站，未列印）');sess(s.nameEn+' 出席（未列印）');}}catch(e){werr(e);}finally{busy=false;}};
renderDock();doSearch();
Auth.start(function(){
  attachAtt(attDay);setInterval(()=>{const d=dayKey();if(d!==attDay){attachAtt(d);toast('已切換至新一天 '+d);}},30000);
  rootRef.child('stations').on('value',s=>{stations=s.val()||{};if(selKey&&!stations[selKey]){selKey=null;localStorage.removeItem(LS);}renderDock();},werr);
  rootRef.child('queues').on('value',s=>{queues=s.val()||{};renderDock();},werr);
  rootRef.child('students').on('value',s=>{students=s.val()||{};renderStats();doSearch();},werr);
  setInterval(renderDock,15000);
});
</script>
</body></html>
