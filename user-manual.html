<!-- user-manual.html — animated bilingual user manual (self-contained) -->
<!doctype html><html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家長標籤及考勤系統 · 使用手冊</title>
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang TC","PingFang HK","Microsoft JhengHei","Noto Sans TC",Helvetica,Arial,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang TC","PingFang HK","Microsoft JhengHei","Noto Sans TC",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --cjk:"Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang HK",sans-serif;
  --bg:#eff5fc;--surface:#fff;--panel:#f6faff;--raise:#e9f1fb;
  --text:#0f2340;--ink2:#26405e;--muted:#5a7391;--faint:#8ba1bd;
  --line:#dae6f4;--line2:#c2d6ea;--hair:#e9f1fa;
  --ac:#0a63cc;--acd:#084c9e;--acs:#e5f0fc;--acl:#b4d1f2;
  --ok:#16794b;--oks:#e4f4ec;--okl:#bce0cd;
  --wn:#8f6410;--wns:#fbf2dd;--wnl:#e8d6a8;
  --r:14px;--rs:8px;--nav:56px;
  --e:cubic-bezier(.25,.6,.3,1);
  --sh:0 1px 2px rgba(15,35,64,.06);--sh2:0 10px 30px rgba(15,35,64,.10);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 14px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
b,strong{font-weight:600}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.015em;margin:0 0 .5em}
p{margin:0 0 .8em}p:last-child{margin-bottom:0}
a{color:var(--acd)}
code{font:13px var(--mono);background:var(--raise);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--acd)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
::selection{background:rgba(10,99,204,.18)}
*{scrollbar-width:thin;scrollbar-color:var(--acl) var(--panel)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--acl);border:3px solid var(--panel);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--ac)}

.nav{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:900;display:flex;align-items:center;gap:14px;padding:0 clamp(14px,4vw,36px);background:rgba(255,255,255,.96);border-bottom:1px solid transparent;transition:.2s}
.nav.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 20px rgba(15,35,64,.07)}
.nav .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;min-width:0}
.nav .mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ac);color:#fff;flex:none}
.nav .mark svg{width:15px;height:15px}
.nav .links{display:flex;gap:2px;margin-left:auto}
.nav .links a{padding:8px 11px;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none}
.nav .links a:hover{color:var(--text)}
.langbtn{font:500 12.5px var(--sans);border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:6px;padding:6px 13px;cursor:pointer;flex:none}
.langbtn:hover{background:var(--acs);border-color:var(--ac);color:var(--acd)}

main{max-width:1060px;margin:0 auto;padding:calc(var(--nav) + 46px) clamp(14px,4vw,36px) 70px}
section{margin-bottom:74px}
.eyebrow{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--ac)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:14px 0 12px}
h2{font-size:clamp(21px,2.6vw,27px)}
.lede{color:var(--muted);font-size:15.5px;max-width:660px}
.head{margin-bottom:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;border:1px solid transparent;border-radius:var(--rs);background:var(--ac);color:#fff;padding:11px 18px;text-decoration:none;transition:.15s}
.btn:hover{background:var(--acd)}
.btn.ghost{background:var(--surface);color:var(--ink2);border-color:var(--line2)}
.btn.ghost:hover{background:var(--acs);border-color:var(--ac);color:var(--acd)}
.row{display:flex;gap:10px;flex-wrap:wrap}

.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s var(--e),transform .55s var(--e)}
.reveal.in{opacity:1;transform:none}

/* hero device */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.device{position:relative;height:300px}
.printer{position:absolute;right:6%;top:26px;width:230px;height:150px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh2)}
.printer .top{position:absolute;left:18px;right:18px;top:16px;height:8px;border-radius:4px;background:var(--raise)}
.printer .slot{position:absolute;left:26px;right:26px;top:44px;height:6px;border-radius:3px;background:var(--line2)}
.printer .led{position:absolute;right:16px;bottom:14px;width:9px;height:9px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
.label-out{position:absolute;left:50%;top:52px;width:150px;transform:translateX(-50%);overflow:visible}
.lab{background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:var(--sh);padding:10px 10px;font-family:var(--cjk);animation:eject 4.4s var(--e) infinite;transform-origin:top center}
.lab span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lab .l1{font-size:9px;font-weight:600;color:var(--ink2)}
.lab .l2{font-size:17px;font-weight:600;margin-top:2px}
.lab .l3{font-size:8.5px;color:var(--muted);margin-top:4px;border-top:1px dashed var(--line2);padding-top:4px}
.reader{position:absolute;left:4%;bottom:26px;width:200px;height:56px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.reader .beam{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--acl),transparent)}
.reader .swipe{position:absolute;top:12px;left:-70px;width:64px;height:32px;border-radius:5px;background:var(--acs);border:1px solid var(--acl);animation:swipe 4.4s var(--e) infinite}
.reader .swipe::after{content:"";position:absolute;left:6px;right:6px;top:9px;height:3px;border-radius:2px;background:var(--acl)}
.reader .ok{position:absolute;right:10px;top:50%;width:16px;height:16px;transform:translateY(-50%)}
.reader .ok path{stroke:var(--ok);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw 4.4s var(--e) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
@keyframes eject{0%{transform:translateY(-46px) scaleY(.2);opacity:0}18%{transform:translateY(0) scaleY(1);opacity:1}70%{transform:translateY(0);opacity:1}88%{transform:translateY(26px);opacity:0}100%{transform:translateY(26px);opacity:0}}
@keyframes swipe{0%{left:-70px}26%{left:66px}46%{left:66px}70%{left:210px}100%{left:210px}}
@keyframes draw{0%,46%{stroke-dashoffset:24}62%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}

/* capability cards */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.cap .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--acs);border:1px solid var(--acl);color:var(--ac);margin-bottom:14px}
.cap .ic svg{width:20px;height:20px}
.cap h3{font-size:17px;margin-bottom:6px}
.cap p{font-size:13.5px;color:var(--muted)}
.cap .pulse{position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(10,99,204,.10),transparent 70%);animation:pulse 3.4s infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:0}40%{opacity:1}100%{transform:scale(1.25);opacity:0}}

/* steps */
.steps{display:grid;gap:14px}
.step{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.step .num{position:absolute;margin:-6px 0 0 -6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 13px var(--mono);background:var(--ac);color:#fff;box-shadow:0 0 0 4px var(--acs)}
.step h3{font-size:16px;margin:0 0 4px}
.step p{font-size:13.5px;color:var(--muted);margin:0}
.scene{position:relative;height:86px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* scene 1 login */
.sc-login .field{position:absolute;left:14px;right:14px;height:16px;border:1px solid var(--line2);border-radius:5px;background:#fff}
.sc-login .f1{top:14px}.sc-login .f2{top:38px}
.sc-login .caret{position:absolute;left:20px;top:17px;width:2px;height:10px;background:var(--ac);animation:caret 1s steps(1) infinite}
.sc-login .go{position:absolute;left:14px;top:62px;width:64px;height:14px;border-radius:5px;background:var(--ac);animation:press 3.2s var(--e) infinite}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes press{0%,55%{transform:scale(1)}65%{transform:scale(.94)}75%,100%{transform:scale(1)}}
/* scene 2 rows */
.sc-rows .r{position:absolute;left:12px;right:12px;height:12px;border-radius:4px;background:var(--raise);opacity:0;animation:rowsIn 3.6s var(--e) infinite}
.sc-rows .r1{top:14px;animation-delay:.1s}.sc-rows .r2{top:34px;animation-delay:.5s}.sc-rows .r3{top:54px;animation-delay:.9s}
.sc-rows .r::after{content:"";position:absolute;left:0;top:0;bottom:0;width:34%;border-radius:4px;background:var(--acl)}
@keyframes rowsIn{0%{opacity:0;transform:translateX(-16px)}18%,78%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
/* scene 3 designer */
.sc-design .canvas{position:absolute;inset:10px;border:1px dashed var(--line2);border-radius:6px;background:#fff}
.sc-design .box{position:absolute;width:52px;height:20px;border:1px solid var(--ac);background:rgba(10,99,204,.08);border-radius:4px;animation:drag 4s var(--e) infinite}
.sc-design .b1{top:18px;left:18px}
.sc-design .b2{top:44px;left:40px;animation-delay:.4s;border-color:var(--acl)}
.sc-design .hd{position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;background:var(--ac);border-radius:2px}
@keyframes drag{0%,12%{transform:none}45%,60%{transform:translate(26px,10px)}90%,100%{transform:none}}
/* scene 4 swipe */
.sc-swipe .bar{position:absolute;left:12px;right:12px;top:40px;height:8px;border-radius:4px;background:var(--line2)}
.sc-swipe .card{position:absolute;top:22px;left:-60px;width:52px;height:30px;border-radius:5px;background:var(--acs);border:1px solid var(--acl);animation:swipe2 3.4s var(--e) infinite}
.sc-swipe .tick{position:absolute;right:14px;top:16px;width:18px;height:18px}
.sc-swipe .tick path{stroke:var(--ok);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;animation:draw2 3.4s var(--e) infinite}
@keyframes swipe2{0%{left:-60px}40%,55%{left:calc(100% - 66px)}100%{left:calc(100% + 10px)}}
@keyframes draw2{0%,40%{stroke-dashoffset:26}58%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
/* scene 5 print */
.sc-print .p{position:absolute;left:50%;top:14px;width:86px;height:34px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line2);border-radius:8px}
.sc-print .p::after{content:"";position:absolute;left:12px;right:12px;top:12px;height:4px;border-radius:2px;background:var(--line2)}
.sc-print .sheet{position:absolute;left:50%;top:34px;width:56px;height:34px;transform:translateX(-50%);background:#fff;border:1px solid var(--line2);border-radius:4px;animation:eject2 3.4s var(--e) infinite}
.sc-print .sheet i{display:block;margin:6px auto 0;width:70%;height:3px;background:var(--acl);box-shadow:0 7px 0 var(--hair),0 14px 0 var(--hair)}
@keyframes eject2{0%{transform:translate(-50%,-24px) scaleY(.3);opacity:0}30%{transform:translate(-50%,0) scaleY(1);opacity:1}80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,16px);opacity:0}}

/* checklist */
.check{display:grid;gap:10px;max-width:720px}
.ck{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-size:14px;box-shadow:var(--sh)}
.ck .bx{flex:none;width:20px;height:20px;margin-top:2px}
.ck .bx rect{fill:#fff;stroke:var(--line2);stroke-width:1.6;rx:4}
.ck .bx path{stroke:var(--ok);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22}
.reveal.in .ck .bx path{animation:tick .5s var(--e) forwards}
.reveal.in .ck:nth-child(1) .bx path{animation-delay:.15s}
.reveal.in .ck:nth-child(2) .bx path{animation-delay:.45s}
.reveal.in .ck:nth-child(3) .bx path{animation-delay:.75s}
.reveal.in .ck:nth-child(4) .bx path{animation-delay:1.05s}
.reveal.in .ck:nth-child(5) .bx path{animation-delay:1.35s}
.reveal.in .ck:nth-child(6) .bx path{animation-delay:1.65s}
@keyframes tick{to{stroke-dashoffset:0}}

/* label anatomy */
.anat-wrap{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:34px;align-items:center}
.anat{position:relative;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh2);padding:20px 18px;font-family:var(--cjk)}
.anat .en{font-size:11px;font-weight:600;color:var(--ink2)}
.anat .zh{font-size:30px;font-weight:600;margin-top:6px}
.anat .mt{font-size:10.5px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px}
.anat .frame{position:absolute;inset:8px;border:1px dashed var(--acl);border-radius:6px;animation:frame 3s var(--e) infinite}
@keyframes frame{0%,100%{opacity:.5}50%{opacity:1}}
.calls{display:grid;gap:12px}
.call{display:flex;gap:12px;align-items:center;font-size:14px}
.call .pin{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px var(--acs);animation:bob 2.4s var(--e) infinite}
.call:nth-child(2) .pin{animation-delay:.3s}
.call:nth-child(3) .pin{animation-delay:.6s}
.call:nth-child(4) .pin{animation-delay:.9s;background:var(--acl)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.note{margin-top:18px;background:var(--wns);border:1px solid var(--wnl);color:var(--wn);border-radius:10px;padding:12px 16px;font-size:13.5px}

/* faq */
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 18px;box-shadow:var(--sh);margin-bottom:10px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:15px 0;font-weight:600;font-size:14.5px}
summary::-webkit-details-marker{display:none}
summary .pm{margin-left:auto;flex:none;width:18px;height:18px;position:relative}
summary .pm::before,summary .pm::after{content:"";position:absolute;left:50%;top:50%;background:var(--ac);border-radius:2px;transform:translate(-50%,-50%);transition:.2s}
summary .pm::before{width:12px;height:2px}
summary .pm::after{width:2px;height:12px}
details[open] summary .pm::after{transform:translate(-50%,-50%) rotate(90deg);opacity:0}
details p{padding:0 0 16px;font-size:13.5px;color:var(--muted);margin:0}

footer{border-top:1px solid var(--line);padding:26px clamp(14px,4vw,36px);color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;max-width:1060px;margin:0 auto}
.cred{background:var(--acs);border:1px solid var(--acl);color:var(--acd);border-radius:10px;padding:14px 18px;font-size:13.5px;margin-top:14px}

@media(max-width:860px){.hero{grid-template-columns:1fr}.device{height:260px;order:-1}.step{grid-template-columns:1fr}.scene{height:96px}.anat-wrap{grid-template-columns:1fr}.nav .links{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.reveal{opacity:1;transform:none}}
</style>
</head><body>

</nav>

<main>
  <section class="hero reveal">
    <div>
      <span class="eyebrow" data-i18n="h.eyebrow"></span>
      <h1 data-i18n="h.h1"></h1>
      <p class="lede" data-i18n="h.lede"></p>
      <div class="row" style="margin-top:22px">
        <a class="btn" href="index.html" data-i18n="h.btnSystem"></a>
        <a class="btn ghost" href="parents-admin.html" data-i18n="h.btnAdmin"></a>
      </div>
    </div>
    <div class="device" aria-hidden="true">
      <div class="printer"><div class="top"></div><div class="slot"></div><div class="led"></div>
        <div class="label-out"><div class="lab"><span class="l1">Parent of 3A 15 CHAN TAI MAN</span><span class="l2">陳大文家長</span><span class="l3">15:30–15:45 · 陳老師 · 204 室</span></div></div>
      </div>
      <div class="reader"><div class="beam"></div><div class="swipe"></div>
        <svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
      </div>
    </div>
  </section>

  <section id="do" class="reveal">
    <div class="head"><span class="eyebrow" data-i18n="s1.k"></span><h2 data-i18n="s1.title"></h2><p class="lede" data-i18n="s1.lede"></p></div>
    <div class="grid3">
      <div class="cap"><span class="pulse"></span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l11 11-7 7L3 10V3z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span><h3 data-i18n="c1.t"></h3><p data-i18n="c1.d"></p></div>
      <div class="cap"><span class="pulse"></span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg></span><h3 data-i18n="c2.t"></h3><p data-i18n="c2.d"></p></div>
      <div class="cap"><span class="pulse"></span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><h3 data-i18n="c3.t"></h3><p data-i18n="c3.d"></p></div>
    </div>
  </section>

  <section id="ends" class="reveal">
    <div class="head"><span class="eyebrow" data-i18n="s2.k"></span><h2 data-i18n="s2.title"></h2><p class="lede" data-i18n="s2.lede"></p></div>
    <div class="grid3">
